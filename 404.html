<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page Not Found | Infinitum Boxing</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;background:#fff;color:#111318;font-family:Barlow,Arial,sans-serif;padding:24px;box-sizing:border-box}
  h1{font-family:'Barlow Condensed',Arial,sans-serif;font-style:italic;font-weight:800;font-size:clamp(72px,18vw,140px);line-height:1;margin:0;color:#d40000}
  h2{margin:8px 0;font-size:24px}
  p{color:#5b616b;margin:0 0 24px}
  a{display:inline-block;background:#d40000;color:#fff;text-decoration:none;font-weight:600;padding:12px 28px;border-radius:4px}
</style>
</head>
<body>
  <main>
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>The page you are looking for does not exist or has been moved.</p>
    <a href="/">Back to Home</a>
  </main>
</body>
</html>
